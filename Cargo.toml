[package]
name = "light-stripe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bollard = "0.21.0"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.32"
netstat2 = "0.11.2"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.5"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
toml = "0.9.0"
